[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymv3d"
version = "0.2.0"
description = "Headless launcher and HDF5-to-NumPy reader for MatViz3D polycrystalline microstructure output"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Oleksii" },
]
keywords = ["matviz3d", "polycrystal", "homogenization", "fft", "hdf5", "materials", "piml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.23",
    "h5py>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/MME-NTU-KhPI/matviz3d-py"
Repository = "https://github.com/MME-NTU-KhPI/matviz3d-py"
"MatViz3D (upstream)" = "https://github.com/MME-NTU-KhPI/MatViz3D"

[tool.hatch.build.targets.wheel]
packages = ["pymv3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
